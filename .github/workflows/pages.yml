name: Deploy Danger Wear Preview

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Download preview package
        run: |
          mkdir -p _site
          curl -L --fail --retry 3 'https://sdmntprpolandcentral.oaiusercontent.com/files/00000000-9580-820a-bfea-555fb8e92153/raw?se=2026-09-16T04%3A45%3A28Z&sp=r&sv=2026-02-06&sr=b&scid=18e06e9f-3bb4-5dfe-b660-5d7c0a7e7005&skoid=e5f84a89-964a-4fd3-92c2-c2cb3a12ea16&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-16T03%3A13%3A14Z&ske=2026-09-17T03%3A13%3A14Z&sks=b&skv=2026-02-06&sig=MFRDWodkGKAda%2BRRmsVdEoX9%2BlC8vgzqyeskoxATzZU%3D' -o site.zip
          unzip -q site.zip -d _site
          touch _site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
